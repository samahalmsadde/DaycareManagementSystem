name: Build and Test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore DaycareAPI2026.csproj
      - name: Build
        run: dotnet build DaycareAPI2026.csproj --no-restore -c Release
      - name: API smoke test
        shell: bash
        run: |
          dotnet run --no-build -c Release --urls http://127.0.0.1:5284 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5284/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5284/api/children
